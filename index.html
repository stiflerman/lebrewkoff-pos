  .top .b{font-size:15.5px;font-weight:700}.top .b span{color:var(--gold2)}

  .conn i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding:9px 15px 0;background:var(--panel);
    border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:35}
  .tabs button{white-space:nowrap;background:none;color:var(--muted);border:none;
    border-bottom:2px solid transparent;padding:8px 12px;font-size:12.5px;font-weight:600;
    cursor:pointer;font-family:inherit}
  .tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
  .tabs button .n{background:var(--red);color:#fff;border-radius:9px;padding:0 5px;font-size:10px;margin-left:4px}
  .wrap{padding:14px 15px 44px;max-width:1080px;margin:0 auto}
  .pane{display:none}.pane.on{display:block}
  h2{font-size:15px;color:var(--gold2);margin-bottom:3px}
  .sub{font-size:11.5px;color:var(--muted);margin-bottom:11px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px}
  .card h3{font-size:13px;color:var(--gold2);margin-bottom:8px;display:flex;
    justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .kpi .l{font-size:10.5px;color:var(--muted)}
  .kpi .v{font-size:21px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums}
  .kpi .x{font-size:10px;color:var(--muted);margin-top:2px}
  .kpi.red{border-color:#6a2f22}.kpi.red .v{color:var(--red)}
  .kpi.amber{border-color:#6a5420}.kpi.amber .v{color:var(--amber)}
  .kpi.green{border-color:#1f5236}.kpi.green .v{color:var(--green)}
  .kpi.gold .v{color:var(--gold2)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}

  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

  tbody tr:hover{background:#2a2118}
  .scroll{max-height:430px;overflow-y:auto;border-radius:9px}
  .pill{font-size:10px;padding:2px 7px;border-radius:9px;font-weight:700;white-space:nowrap;display:inline-block}
  .p-out{background:#3a1512;color:#f0a090}.p-low{background:#3a2d10;color:var(--amber)}
  .p-watch{background:#33300f;color:#ddd08a}.p-ok{background:#123320;color:var(--green)}
  .p-info{background:#12283a;color:var(--blue)}.p-mut{background:var(--card2);color:var(--muted)}
  .btn{background:var(--gold);color:#1a1109;border:none;border-radius:8px;padding:9px 14px;
    font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sec{background:var(--card2);color:var(--gold2);border:1px solid var(--line)}
  .btn.grn{background:var(--green);color:#0c1a10}
  .btn.dan{background:#4a1f18;color:#f0a090;border:1px solid #6a2f22}
  .btn.sm{padding:4px 10px;font-size:11px;border-radius:7px}
  .btn.wide{width:100%;padding:11px}
  input,select,textarea{background:#171109;color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input.mini{padding:5px 8px;font-size:12px;width:98px;text-align:right;font-weight:700}
  input.mini:focus{background:#1e1509;box-shadow:0 0 0 2px rgba(224,160,60,.18)}
  input.mini.done{border-color:#2c5a3d}input.mini.diff{border-color:#6a5420;color:var(--amber)}
  .fld{margin-bottom:11px}.fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  tr.dim td{opacity:.45}
  .note{background:#241a0e;border:1px solid #4d3a1c;border-radius:10px;padding:10px 12px;
    font-size:11.5px;color:#efdcbd;margin-top:9px}
  .note b{color:var(--gold2)}
  .note.warn{background:#2a1611;border-color:#5f2a1e;color:#f2cdbf}.note.warn b{color:#f2a58c}
  .note.ok{background:#132a1c;border-color:#1f5236;color:#c9e8d4}.note.ok b{color:var(--green)}
  .note.info{background:#111f2a;border-color:#254456;color:#c7e0ee}.note.info b{color:var(--blue)}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.76);display:none;align-items:center;
    justify-content:center;z-index:60;padding:14px}
  .mask.on{display:flex}
  .modal{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:17px;
    width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
  .modal h3{font-size:15px;color:var(--gold2);margin-bottom:10px}
  .macts{display:flex;gap:7px;margin-top:13px}.macts .btn{flex:1}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--green);
    color:#0b1a10;padding:10px 18px;border-radius:20px;font-weight:700;font-size:12.5px;opacity:0;
    transition:.28s;z-index:90;box-shadow:0 6px 22px rgba(0,0,0,.45);pointer-events:none;
    max-width:92vw;text-align:center}
  .toast.on{opacity:1;bottom:28px}
  .toast.warn{background:var(--amber);color:#2a1c05}.toast.err{background:var(--red);color:#2a0c06}
  .seg{display:flex;gap:5px;margin-bottom:10px}
  .seg button{flex:1;background:var(--card2);color:var(--muted);border:1px solid var(--line);
    border-radius:9px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .seg button.on{border-color:var(--gold);color:var(--gold2);background:#2f2517}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:12px}
  .bar{height:5px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:3px;min-width:52px}
  .bar i{display:block;height:100%;border-radius:4px}
  .doc{font-family:'Courier New',monospace;font-size:11.5px;color:var(--gold2)}
  .lock{background:#2a1611;border:1px solid #5f2a1e;border-radius:10px;padding:11px 13px;
    font-size:11.5px;color:#f2cdbf}
  .flow{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);
    flex-wrap:wrap;margin-bottom:10px}
  .flow i{font-style:normal;background:var(--card2);border:1px solid var(--line);
    border-radius:14px;padding:3px 10px}
  .spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--gold);
    border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{text-align:center;color:var(--muted);padding:30px;font-size:12.5px}
  .err{background:#2a1611;border:1px solid #5f2a1e;color:#f2cdbf;border-radius:10px;
    padding:10px 12px;font-size:11.5px;margin-bottom:10px}
</style>
</head>

<div id="login">
  <div class="lbox">
    <div class="logo">☕</div>

<div id="app" style="display:none">

<script>

// ================= การเชื่อมต่อ =================
const SUPA_URL = 'https://mfgoitozgatlpxzflcie.supabase.co';
const SUPA_KEY = 'sb_publishable_2JPipIEoYmNRmhntLNBNqQ_qXgTU-Jc';
let sb = null;
try{ sb = window.supabase.createClient(SUPA_URL, SUPA_KEY); }catch(e){}

const $=i=>document.getElementById(i);
const fmt=n=>Math.round(Number(n)||0).toLocaleString();
const fmt2=n=>(Math.round((Number(n)||0)*100)/100).toLocaleString();
const ymd=d=>new Date(d).toLocaleString('th-TH',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
let tt;function toast(m,k){const t=$('toast');t.textContent=m;t.className='toast on'+(k?' '+k:'');
  clearTimeout(tt);tt=setTimeout(()=>t.className='toast',3200);}
function openM(h){$('modal').innerHTML=h;$('mask').classList.add('on');}
function closeM(){$('mask').classList.remove('on');}
$('mask').onclick=e=>{if(e.target.id==='mask')closeM();};
function setConn(ok,txt){const c=$('conn');c.className='conn '+(ok?'ok':'bad');$('connTxt').textContent=txt;}

// สถานะรวมของแอป
const S={me:null, branch:null, locs:[], stock:[], ing:[], reqs:[], pos:[], counts:[],
         loss:[], todo:[], monthly:[], team:[], roles:[], showLeft:false,
         loc:'front', tab:'home', curCount:null, draft:[]};
// สิทธิ์อ่านจากตาราง staff_roles ในฐานข้อมูล ไม่ได้ฝังไว้ในหน้าจอ
const myRole   =()=>S.roles.find(r=>r.code===S.me?.role)||{};
const isBoss   =()=>!!myRole().can_approve;
const isWh     =()=>!!myRole().can_purchase;
const canTeam  =()=>!!myRole().can_manage_staff;
const readOnly =()=>!!myRole().read_only;
const roleTh   =r=>(S.roles.find(x=>x.code===r)||{}).name_th||r;
// ตำแหน่งระดับสูง — เฉพาะเจ้าของเท่านั้นที่ตั้ง/แก้ได้ (ผู้จัดการแก้ไม่ได้)
const SENIOR   =['owner','hq_admin','investor','manager','assistant_manager'];

// ================= ล็อกอิน =================
async function boot(){
  if(!sb){
    $('lerr').innerHTML='<div class="err"><b>เชื่อมต่อไม่ได้</b><br>'
      +'ครั้งแรกที่เปิดไฟล์นี้ต้องมีอินเทอร์เน็ต · ถ้าเน็ตปกติแล้วยังขึ้นแบบนี้ '
      +'อาจโดนไฟร์วอลล์บล็อก ลองเปิดด้วยมือถือ/เน็ตอื่นดู แล้วกดรีเฟรชหน้า</div>';
    return; }
  const {data}=await sb.auth.getSession();
  if(data.session) await afterLogin();
}
async function doLogin(){
  const em=$('em').value.trim(), pw=$('pw').value;
  if(!em||!pw){$('lerr').innerHTML='<div class="err">กรอกอีเมลและรหัสผ่านก่อน</div>';return;}
  $('lbtn').disabled=true;$('lbtn').innerHTML='<span class="spin"></span> กำลังเข้าสู่ระบบ...';
  $('lerr').innerHTML='';
  const {error}=await sb.auth.signInWithPassword({email:em,password:pw});
  $('lbtn').disabled=false;$('lbtn').textContent='เข้าสู่ระบบ';
  if(error){
    const m=/Invalid login/i.test(error.message)?'อีเมลหรือรหัสผ่านไม่ถูกต้อง'
           :/network|fetch/i.test(error.message)?'ต่ออินเทอร์เน็ตไม่ได้ — เช็กสัญญาณแล้วลองใหม่'
           :error.message;
    $('lerr').innerHTML=`<div class="err">${m}</div>`;return;
  }
  await afterLogin();
}
async function afterLogin(){
  const {data:{user}}=await sb.auth.getUser();
  const {data:st,error}=await sb.from('staff')
    .select('id,full_name,nickname,role,branch_id,approve_pin,login_email')
    .eq('user_id',user.id).maybeSingle();
  if(error||!st){
    $('lerr').innerHTML='<div class="err">บัญชีนี้ยังไม่ได้ผูกกับพนักงานคนไหน — ให้เจ้าของตั้งค่าให้ก่อน</div>';
    await sb.auth.signOut(); return;
  }
  S.me=st;
  const {data:br}=await sb.from('branches').select('id,code,name,branch_type').eq('id',st.branch_id).maybeSingle();

// ================= โหลดข้อมูลจากฐานข้อมูลจริง =================
async function reloadAll(){
  setConn(true,'กำลังโหลด…');
  try{
    const [locs,stock,ing,tr,po,ct,mv,todo,mon,rl,tm,pm]=await Promise.all([
      sb.from('stock_locations').select('*').eq('is_active',true),
      sb.from('v_stock_status').select('*'),
      sb.from('ingredients').select('id,name,base_unit,ingredient_group,cost_per_unit').eq('is_active',true).order('name'),
      sb.from('v_transfers').select('*').order('requested_at',{ascending:false}).limit(50),
      sb.from('v_purchase_orders').select('*').order('ordered_at',{ascending:false}).limit(50),
      sb.from('v_stock_counts').select('*').order('counted_at',{ascending:false}).limit(50),
      sb.from('stock_movements').select('*, ingredients(name,base_unit), stock_locations(name), staff(full_name)')
        .eq('movement_type','loss').order('created_at',{ascending:false}).limit(80),
      sb.from('v_stock_todo').select('*'),
      sb.from('v_branch_monthly').select('*').not('month','is',null).order('month',{ascending:false}).limit(12),
      sb.from('staff_roles').select('*').order('sort_order'),
      sb.from('v_staff').select('*').order('role_order').order('full_name'),
      sb.from('promotions').select('*').order('is_active',{ascending:false}).order('name')
    ]);
    const bad=[locs,stock,ing,tr,po,ct,mv,todo,mon].find(r=>r.error);
    if(bad) throw bad.error;
    S.locs=locs.data||[]; S.stock=stock.data||[]; S.ing=ing.data||[];
    S.reqs=tr.data||[]; S.pos=po.data||[]; S.counts=ct.data||[];
    S.loss=mv.data||[]; S.todo=todo.data||[]; S.monthly=mon.data||[];
    S.roles=rl.data||[]; S.team=tm.data||[]; S.promos=pm.data||[];
    setConn(true,'ต่อฐานข้อมูลแล้ว');
    renderAll();
  }catch(e){
    setConn(false,'ต่อไม่ได้');
    toast('โหลดข้อมูลไม่สำเร็จ: '+(e.message||e),'err');
  }
}
const locId=t=>(S.locs.find(l=>t==='front'?l.loc_type==='front':l.loc_type!=='front')||{}).id;
async function rpc(fn,args){
  const {data,error}=await sb.rpc(fn,args);
  if(error) throw error;
  if(data && data.ok===false) throw new Error(data.message||'ทำรายการไม่สำเร็จ');
  return data;
}

function poRecvPrev(){
  let h='';
  const sh=window._P.filter(l=>Number(l.qty_ordered)-l.got>0);

    return {...l,na,pc:(l.real-l.avg)/l.avg*100};});
  if(sh.length)h+=`<div class="note warn"><b>ได้ของไม่ครบ ${sh.length} รายการ</b><br>
    ${sh.map(l=>`• ${l.ingredient} — สั่ง ${fmt(l.qty_ordered)} ได้ ${fmt(l.got)}`).join('<br>')}</div>`;
  if(chg.length)h+=`<div class="note"><b>ราคาเปลี่ยน ${chg.length} รายการ — ต้นทุนใหม่หลังถัวเฉลี่ย</b><br>
    ${chg.map(l=>`• ${l.ingredient} ${l.pc>0?'↑ ขึ้น':'↓ ลง'} ${Math.abs(l.pc).toFixed(1)}% · ต้นทุนโกดัง ${fmt2(l.avg)} → <b>${l.na.toFixed(2)}</b>`).join('<br>')}</div>`;
  if(!h)h=`<div class="note ok"><b>ได้ของครบ ราคาเท่าเดิม ✅</b></div>`;
  $('rpp').innerHTML=h;
}

function ctRows(ro){
  $('ctr').innerHTML=window._C.map((l,i)=>`<tr>
    <td>${l.ingredient}<div style="font-size:10px;color:var(--muted)">${l.unit}</div></td>
    <td class="num" style="color:var(--muted)">${fmt(l.sys)}</td>
    <td class="num">${ro?(l.cnt===null?'—':fmt(l.cnt)):
      `<input class="mini" id="ci_${i}" type="number" inputmode="decimal" step="any" autocomplete="off"
        placeholder="พิมพ์ตัวเลข" value="${l.cnt===null?'':l.cnt}" onfocus="this.select()"
        oninput="ctSet(${i},this.value)" onkeydown="ctKey(event,${i})">`}</td>
    <td class="num" id="cd_${i}"></td><td id="cw_${i}"></td></tr>`).join('');
  window._C.forEach((l,i)=>ctRow(i,ro)); ctPrev();
}
function ctRow(i,ro){
  const l=window._C[i]; const d=l.cnt===null?null:l.cnt-l.sys;
  const col=d===null?'var(--muted)':d===0?'var(--green)':d>0?'var(--blue)':'var(--red)';
  const dc=$('cd_'+i); if(dc){dc.style.color=col;dc.style.fontWeight='700';
    dc.textContent=d===null?'—':(d>0?'+':'')+fmt(d);}
  const wc=$('cw_'+i);
  if(wc)wc.innerHTML=(d&&!ro)
    ? `<select style="font-size:11px;padding:4px 6px" onchange="ctWhy(${i},this.value)">
        <option value="">— เลือกสาเหตุ —</option>
        ${WHY.map(w=>`<option ${l.why===w?'selected':''}>${w}</option>`).join('')}</select>`
    : (l.why?`<span style="font-size:10.5px;color:var(--muted)">${l.why}</span>`:'');
  const inp=$('ci_'+i);
  if(inp){inp.classList.toggle('done',l.cnt!==null&&d===0);inp.classList.toggle('diff',l.cnt!==null&&d!==0);}
}
function ctKey(e,i){
  if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();const n=$('ci_'+(i+1));if(n){n.focus();n.select();}}
  if(e.key==='ArrowUp'){e.preventDefault();const n=$('ci_'+(i-1));if(n){n.focus();n.select();}}
}
let saveT={};
function ctSet(i,v){
  const l=window._C[i]; const n=parseFloat(v);
  l.cnt=(v===''||isNaN(n))?null:Math.max(n,0);
  if(l.cnt===l.sys)l.why='';
  ctRow(i,false);ctPrev();
  clearTimeout(saveT[i]);
  saveT[i]=setTimeout(()=>pushLine(i),700);   // บันทึกขึ้นระบบอัตโนมัติหลังหยุดพิมพ์
}
function ctWhy(i,v){window._C[i].why=v;ctRow(i,false);ctPrev();pushLine(i);}
async function pushLine(i){
  const l=window._C[i]; if(l.cnt===null)return;
  try{ await sb.rpc('save_count_line',{p_item_id:l.item_id,p_counted:l.cnt,p_reason:l.why||null}); }
  catch(e){ toast('บันทึกไม่สำเร็จ: '+e.message,'err'); }
}
function ctPrev(){
  const pend=window._C.filter(l=>l.cnt===null).length;
  const diff=window._C.filter(l=>l.cnt!==null&&l.cnt!==l.sys);
  const noWhy=diff.filter(l=>!l.why);
  const val=diff.reduce((s,l)=>s+(l.cnt-l.sys)*0,0);
  let h='';
  if(pend)h+=`<div class="note warn"><b>ยังนับไม่ครบ เหลืออีก ${pend} รายการ</b></div>`;
  if(noWhy.length)h+=`<div class="note warn"><b>มี ${noWhy.length} รายการที่ไม่ตรง แต่ยังไม่ได้เลือกสาเหตุ</b></div>`;
  if(!pend&&!noWhy.length)h+=diff.length
    ?`<div class="note"><b>นับครบแล้ว · ต่างกัน ${diff.length} รายการ</b><br>พร้อมให้คนที่ 2 อนุมัติ</div>`
    :`<div class="note ok"><b>นับครบและตรงกับระบบทุกรายการ ✅</b></div>`;
  $('cp').innerHTML=h;
}
async function ctFill(){
  let n=0;
  for(let i=0;i<window._C.length;i++){const l=window._C[i];
    if(l.cnt===null){l.cnt=l.sys;l.why='';n++;await pushLine(i);}}
  ctRows(false);toast(n?`เติมให้ ${n} รายการว่า "ตรงกับระบบ"`:'ไม่มีช่องว่างเหลือแล้ว',n?'':'warn');
}

      <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="รหัส 4 หลัก"
        onkeydown="if(event.key==='Enter')doApprove('${id}')"></div>

function pinCell(t){
  if(!t.approve_pin) return '<span style="color:var(--muted)">—</span>';
  const shown = !!(S.showPin||{})[t.id];
  return `<span style="font-family:ui-monospace,monospace;font-size:12.5px;letter-spacing:1px">
      ${shown?t.approve_pin:'••••'}</span>
    <button class="btn sm sec" style="padding:2px 6px;margin-left:5px"
      onclick="togglePin('${t.id}')" title="${shown?'ซ่อน':'ดูรหัส'}">${shown?'🙈':'👁'}</button>
    `;
}
function togglePin(id){ S.showPin=S.showPin||{}; S.showPin[id]=!S.showPin[id]; rTeam(); }

// ---- สวิตช์สิทธิ์อนุมัติส่วนลด (รายคน · ผู้จัดการ/เจ้าของเปิด-ปิดได้) ----
function apprCell(t){
  const on = !!t.can_approve_discount;
  const pill = `<span class="pill ${on?'p-ok':'p-mut'}">${on?'✅ อนุมัติได้':'ปิดอยู่'}</span>`;
  const note = m=>`<div style="font-size:9.5px;color:var(--muted);margin-top:2px">${m}</div>`;
  if(t.id===S.me?.id)  return pill+note('สวิตช์ของตัวเอง ต้องให้คนอื่นกดให้');
  if(!t.is_active)     return pill+note('ปิดบัญชีอยู่');
  if(!myRole().all_branches && SENIOR.includes(t.role)) return pill+note('ต้องให้เจ้าของเปิด-ปิด');
  if(!t.approve_pin)   return `<span class="pill p-mut">ปิดอยู่</span>`
                             +`<div style="font-size:9.5px;color:var(--amber);margin-top:2px">ตั้งรหัสอนุมัติก่อน</div>`;
  return pill+`<div style="margin-top:3px"><button class="btn sm ${on?'dan':'grn'}" style="padding:2px 8px"
      onclick="doSetApprove('${t.id}',${!on})">${on?'ปิดสิทธิ์':'เปิดสิทธิ์'}</button></div>`;
}

      <input id="np2" type="password" placeholder="ยืนยันรหัสผ่านใหม่"></div>
    <div class="macts"><button class="btn sec" onclick="closeM()">ปิด</button>
      <button class="btn" id="pwb" onclick="changePw()">เปลี่ยนรหัสผ่าน</button></div>`);
}
async function changePw(){
  const a=$('np').value, b=$('np2').value;
  if(a.length<8)return toast('รหัสผ่านต้องยาวอย่างน้อย 8 ตัว','err');
  if(a!==b)return toast('รหัสผ่านสองช่องไม่ตรงกัน','err');
  const btn=$('pwb');btn.disabled=true;btn.innerHTML='<span class="spin"></span> กำลังเปลี่ยน...';
  const {error}=await sb.auth.updateUser({password:a});
  btn.disabled=false;btn.textContent='เปลี่ยนรหัสผ่าน';
  if(error)return toast(error.message,'err');
  closeM();toast('เปลี่ยนรหัสผ่านเรียบร้อย ✅');
}


// ================= 🎁 โปรโมชั่น =================
const promoDesc = p => p.promo_type==='percent'
  ? 'ลด '+Number(p.value)+'%'+(p.max_discount?' (สูงสุด '+fmt(p.max_discount)+' ₭)':'')
  : 'ลด '+fmt(p.value)+' ₭';
const promoWhen = p => (!p.start_date && !p.end_date) ? 'ไม่จำกัดเวลา'
  : (p.start_date?ymdOnly(p.start_date):'—') + ' → ' + (p.end_date?ymdOnly(p.end_date):'ไม่มีวันจบ');
const ymdOnly = d => new Date(d).toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'});
function promoLive(p){
  if(!p.is_active) return {k:'off', t:'ปิดอยู่'};
  const t=new Date().toISOString().slice(0,10);
  if(p.start_date && p.start_date > t) return {k:'wait', t:'ยังไม่ถึงวันเริ่ม'};
  if(p.end_date   && p.end_date   < t) return {k:'exp',  t:'หมดอายุแล้ว'};
  return {k:'on', t:'ใช้งานอยู่'};
}

function rPromo(){
  if(!canTeam()){ $('p_promo').innerHTML=''; return; }
  const all=(S.promos||[]);
  const shop=all.filter(p=>!p.is_staff_perk), perk=all.filter(p=>p.is_staff_perk);
  const live=shop.filter(p=>promoLive(p).k==='on').length;

  const row = p => {
    const st=promoLive(p);
    return `<tr class="${p.is_active?'':'dim'}">
      <td><b>${p.name}</b><div style="font-size:10.5px;color:var(--muted)">${promoWhen(p)}</div></td>
      <td>${promoDesc(p)}</td>
      <td class="num">${Number(p.min_total||0)?fmt(p.min_total)+' ₭':'—'}</td>
      <td><span class="pill ${st.k==='on'?'p-ok':st.k==='off'?'p-mut':'p-low'}">${st.t}</span></td>
      <td class="num" style="white-space:nowrap">
        <button class="btn sm sec" onclick="openPromo('${p.id}')">แก้ไข</button>
        <button class="btn sm ${p.is_active?'dan':''}" onclick="togglePromo('${p.id}',${!p.is_active})">
          ${p.is_active?'ปิด':'เปิด'}</button></td></tr>`;};

  $('p_promo').innerHTML=`
    <h2>โปรโมชั่น / ส่วนลด</h2>
    <div class="sub">เปิด-ปิดได้ทันที · ปิดแล้วหน้าขายจะไม่เห็นโปรฯ นั้นอีก · ทุกส่วนลดที่หน้าร้านต้องมีรหัสอนุมัติเสมอ</div>
    <div class="kpis">
      <div class="kpi green"><div class="l">ใช้งานอยู่ตอนนี้</div><div class="v">${live}</div>
        <div class="x">หน้าขายเห็นเท่านี้</div></div>
      <div class="kpi"><div class="l">ทั้งหมด</div><div class="v">${shop.length}</div></div>
      <div class="kpi"><div class="l">สิทธิ์พนักงาน</div><div class="v">${perk.length}</div>
        <div class="x">ยังไม่เปิดใช้ในหน้าขาย</div></div>
    </div>

    <div class="card"><h3><span>โปรโมชั่นร้าน (${shop.length})</span>
      <button class="btn sm" onclick="openPromo()">+ เพิ่มโปรโมชั่น</button></h3>
      ${shop.length?`<div class="scroll"><table><thead><tr>
        <th>ชื่อ</th><th>ลดเท่าไหร่</th><th class="num">ยอดขั้นต่ำ</th><th>สถานะ</th><th></th>
        </tr></thead><tbody>${shop.map(row).join('')}</tbody></table></div>`
       :`<div class="empty">ยังไม่มีโปรโมชั่น — กด "เพิ่มโปรโมชั่น" เพื่อสร้างอันแรก</div>`}
    </div>

    ${perk.length?`<div class="card"><h3><span>สิทธิ์พนักงาน (${perk.length})</span></h3>
      <div class="note info" style="margin-top:0">ตั้งไว้ล่วงหน้าแล้ว แต่<b>ยังไม่เปิดใช้ในหน้าขาย</b>
        เพราะต้องผูกกับระบบนับโควตาเครื่องดื่มพนักงานก่อน — จะทำในรอบถัดไป</div>
      <div class="scroll"><table><tbody>${perk.map(p=>`<tr class="dim">
        <td><b>${p.name}</b></td><td>${promoDesc(p)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
}

function openPromo(id){
  const p = id ? (S.promos||[]).find(x=>x.id===id) : null;
  openM(`<h3>${p?'✏️ แก้ไขโปรโมชั่น':'➕ เพิ่มโปรโมชั่น'}</h3>
    <div class="fld"><label>ชื่อโปรโมชั่น * <span style="color:var(--muted)">(พนักงานจะเห็นชื่อนี้ตอนเลือก)</span></label>
      <input id="pm_name" value="${p?String(p.name).replace(/"/g,'&quot;'):''}" placeholder="เช่น ลดวันเกิด 15%"></div>
    <div class="row2">
      <div class="fld"><label>ลดแบบไหน *</label>
        <select id="pm_type" onchange="promoPrev()">
          <option value="percent" ${!p||p.promo_type==='percent'?'selected':''}>ลดเป็นเปอร์เซ็นต์ (%)</option>
          <option value="amount"  ${p&&p.promo_type==='amount'?'selected':''}>ลดเป็นจำนวนเงิน (₭)</option>
        </select></div>
      <div class="fld"><label>ลดเท่าไหร่ *</label>
        <input id="pm_val" type="number" inputmode="decimal" oninput="promoPrev()"
               value="${p?Number(p.value):''}" placeholder="เช่น 10"></div></div>
    <div class="row2">
      <div class="fld"><label>ยอดขั้นต่ำ (₭)</label>
        <input id="pm_min" type="number" inputmode="numeric" oninput="promoPrev()"
               value="${p&&Number(p.min_total)?Number(p.min_total):''}" placeholder="0 = ไม่กำหนด"></div>
      <div class="fld"><label>ลดได้สูงสุด (₭)</label>
        <input id="pm_max" type="number" inputmode="numeric" oninput="promoPrev()"
               value="${p&&p.max_discount?Number(p.max_discount):''}" placeholder="เว้นว่าง = ไม่จำกัด"></div></div>
    <div class="row2">
      <div class="fld"><label>เริ่มวันที่</label>
        <input id="pm_s" type="date" value="${p&&p.start_date?p.start_date:''}"></div>
      <div class="fld"><label>ถึงวันที่</label>
        <input id="pm_e" type="date" value="${p&&p.end_date?p.end_date:''}"></div></div>
    <div class="fld"><label>สถานะ</label>
      <select id="pm_act">
        <option value="1" ${!p||p.is_active?'selected':''}>เปิดใช้งาน — หน้าขายเห็นทันที</option>
        <option value="0" ${p&&!p.is_active?'selected':''}>ปิดไว้ก่อน</option>
      </select></div>
    <div id="pm_prev"></div>
    <div id="pm_err"></div>
    <div class="macts"><button class="btn sec" onclick="closeM()">ยกเลิก</button>
      <button class="btn" id="pm_btn" onclick="savePromo(${p?`'${p.id}'`:'null'})">บันทึก</button></div>`);
  promoPrev();
}

function promoPrev(){
  const t=$('pm_type').value, v=Number($('pm_val').value||0);
  const mn=Number($('pm_min').value||0), mx=Number($('pm_max').value||0);
  if(!v) return $('pm_prev').innerHTML='';
  const ex=[60000,120000].map(sub=>{
    if(mn && sub<mn) return `บิล ${fmt(sub)} ₭ → <b>ใช้ไม่ได้</b> (ยอดไม่ถึงขั้นต่ำ)`;
    let d = t==='percent' ? sub*v/100 : v;
    if(mx) d=Math.min(d,mx);
    d=Math.round(Math.min(d,sub));
    return `บิล ${fmt(sub)} ₭ → ลด <b>${fmt(d)} ₭</b> → จ่าย <b>${fmt(sub-d)} ₭</b>`;
  }).join('<br>');
  $('pm_prev').innerHTML=`<div class="note" style="margin-top:4px"><b>ลองคำนวณให้ดู</b><br>${ex}</div>`;
}

async function savePromo(id){
  const err=m=>$('pm_err').innerHTML='<div class="note warn" style="margin-top:6px">'+m+'</div>';
  const name=$('pm_name').value.trim(), type=$('pm_type').value, val=Number($('pm_val').value||0);
  if(!name) return err('ต้องใส่ชื่อโปรโมชั่น');
  if(!val||val<=0) return err('ต้องใส่ตัวเลขส่วนลดมากกว่า 0');
  if(type==='percent'&&val>100) return err('ลดเป็นเปอร์เซ็นต์ เกิน 100% ไม่ได้');
  $('pm_btn').disabled=true; $('pm_btn').textContent='กำลังบันทึก...';
  try{
    const r=await rpc('promo_save',{
      p_id:id, p_name:name, p_promo_type:type, p_value:val,
      p_min_total:Number($('pm_min').value||0),
      p_max_discount:$('pm_max').value?Number($('pm_max').value):null,
      p_start_date:$('pm_s').value||null, p_end_date:$('pm_e').value||null,
      p_is_active:$('pm_act').value==='1', p_branch_id:null });
    closeM(); toast(r.message||'บันทึกแล้ว'); await reloadAll();
  }catch(e){ $('pm_btn').disabled=false; $('pm_btn').textContent='บันทึก'; err(e.message||e); }
}

async function togglePromo(id,on){
  try{ const r=await rpc('promo_toggle',{p_id:id,p_active:on});
       toast(r.message||'เรียบร้อย', on?'':'warn'); await reloadAll(); }
  catch(e){ toast(e.message||e,'err'); }
}

go('home');
boot();

</script>

</body>
</html>
